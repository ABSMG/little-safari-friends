name: Build private video

on:
  workflow_dispatch:

  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

concurrency:
  group: little-safari-friends-video
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Blender, FFmpeg and headless rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            blender \
            ffmpeg \
            xvfb \
            libgl1-mesa-dri \
            libegl1 \
            libxrender1 \
            libxext6 \
            libsm6
          blender --version
          ffmpeg -version
          xvfb-run --help

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify episode configuration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("episode.json")
          if not path.exists():
              raise SystemExit("ERROR: episode.json was not found.")

          episode = json.loads(path.read_text(encoding="utf-8"))

          required = ["episode_id", "scenes"]
          missing = [key for key in required if key not in episode]

          if missing:
              raise SystemExit(
                  f"ERROR: Missing required episode fields: {missing}"
              )

          if not episode["scenes"]:
              raise SystemExit("ERROR: episode.json contains no scenes.")

          print(f"Episode: {episode['episode_id']}")
          print(f"Scenes: {len(episode['scenes'])}")
          print("Episode configuration verified.")
          PY

      - name: Build animated episode
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          mkdir -p output
          xvfb-run -a -s "-screen 0 1280x720x24" \
            python scripts/create_episode.py

      - name: Verify generated MP4
        run: |
          set -eu

          VIDEO="output/$(python -c 'import json; print(json.load(open("episode.json", encoding="utf-8"))["episode_id"])').mp4"

          if [ ! -s "$VIDEO" ]; then
            echo "ERROR: Final MP4 is missing or empty: $VIDEO"
            echo "Available output files:"
            ls -lah output || true
            exit 1
          fi

          ffprobe -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            "$VIDEO"

          echo "Video verification passed: $VIDEO"

      - name: Save MP4 as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: little-safari-friends-video
          path: output/*.mp4
          if-no-files-found: error
          retention-days: 7

      - name: Upload to YouTube privately when credentials are configured
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          set -eu

          if [ -n "$YOUTUBE_CLIENT_ID" ] && \
             [ -n "$YOUTUBE_CLIENT_SECRET" ] && \
             [ -n "$YOUTUBE_REFRESH_TOKEN" ]; then

            VIDEO="output/$(python -c 'import json; print(json.load(open("episode.json", encoding="utf-8"))["episode_id"])').mp4"

            if [ ! -s "$VIDEO" ]; then
              echo "ERROR: Video not found for YouTube upload: $VIDEO"
              exit 1
            fi

            python scripts/upload_youtube.py "$VIDEO"
          else
            echo "YouTube upload skipped: repository secrets are not all configured."
            echo "The generated video remains available as a workflow artifact."
          fi
