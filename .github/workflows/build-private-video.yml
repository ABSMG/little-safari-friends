name: Little Safari Friends Automation

on:
  workflow_dispatch:

  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

concurrency:
  group: little-safari-friends-video
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Blender and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            blender \
            ffmpeg \
            xvfb \
            libgl1-mesa-dri \
            libegl1 \
            libxrender1 \
            libxext6 \
            libsm6

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate a new episode
        run: |
          python scripts/generate_episode.py

      - name: Validate episode
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("episode.json")
          episode = json.loads(path.read_text(encoding="utf-8"))

          assert episode.get("episode_id"), "Missing episode_id"
          assert episode.get("title"), "Missing title"
          assert episode.get("scenes"), "No scenes found"

          print("Episode:", episode["title"])
          print("Scenes:", len(episode["scenes"]))
          print("Episode validation passed.")
          PY

      - name: Render animated video and narration
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          mkdir -p output
          xvfb-run -a -s "-screen 0 1280x720x24" \
            python scripts/create_episode.py

      - name: Verify video
        run: |
          set -eu

          VIDEO="output/$(python -c 'import json; print(json.load(open("episode.json", encoding="utf-8"))["episode_id"])').mp4"

          test -s "$VIDEO"

          ffprobe -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            "$VIDEO"

      - name: Save video for download
        uses: actions/upload-artifact@v4
        with:
          name: little-safari-friends-video
          path: output/*.mp4
          if-no-files-found: error
          retention-days: 7

      - name: Upload video to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: private
        run: |
          if [ -n "$YOUTUBE_CLIENT_ID" ] && \
             [ -n "$YOUTUBE_CLIENT_SECRET" ] && \
             [ -n "$YOUTUBE_REFRESH_TOKEN" ]; then
            python scripts/upload_youtube.py
          else
            echo "YouTube upload skipped."
            echo "Configure the three YouTube repository secrets."
          fi
